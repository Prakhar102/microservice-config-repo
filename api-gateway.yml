server:
  port: 5000

spring:
  cloud:
    gateway:
      routes:

        - id: order-ms
          uri: lb://order-ms
          predicates:
            - Path=/order/**

        - id: payment-ms
          uri: lb://payment-ms
          predicates:
            - Path=/payment/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
